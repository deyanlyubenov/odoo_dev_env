[options]
; Database settings
db_host = localhost
db_port = 5432
db_user = odoo
db_password = odoo
db_name = False
db_sslmode = prefer

; Odoo Web interface
http_port = 8069
longpolling_port = 8072

; Addons path (will be set dynamically by run-odoo.sh)
addons_path =

; Logging
log_level = info
log_handler = :INFO

; Admin password
admin_passwd = admin

; Workers (0 for development)
workers = 0

; Auto reload for development
dev_mode = reload,qweb,werkzeug,xml

; Limit time for CPU / Real
limit_time_cpu = 600
limit_time_real = 1200

; Data directory
data_dir = ./odoo_data
