version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: odoo18_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - odoo_postgres_data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    networks:
      - odoo_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: odoo18_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@odoo.local
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_LISTEN_PORT=80
    ports:
      - "5050:80"
    volumes:
      - odoo_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - odoo_network

volumes:
  odoo_postgres_data:
    driver: local
  odoo_pgadmin_data:
    driver: local

networks:
  odoo_network:
    driver: bridge
